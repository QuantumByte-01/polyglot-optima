<!-- START -->
<rect x="290" y="30" width="180" height="36" rx="18" fill="#111827" stroke="#111827"/>

<line x1="380" y1="66" x2="380" y2="98" stroke="#111827" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- STEP 1 -->

<text x="380" y="137" text-anchor="middle" font-weight="600" fill="#78350f">Dataset Loader + Curriculum State</text>
<text x="380" y="152" text-anchor="middle" font-size="9.5" fill="#b45309">Draw Python fn · freeze difficulty axes · assign HW profile (1 of 8)</text>

<text x="770" y="203" text-anchor="middle" font-weight="600" fill="#7f1d1d">trap_library.py</text>

<text x="770" y="235" text-anchor="middle" font-size="9" fill="#b91c1c">AST no-op rewrites</text>

<line x1="380" y1="328" x2="380" y2="348" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ag)"/>

<text x="450" y="530" text-anchor="middle" font-size="9.5" fill="#2563eb">verify_equivalence</text>
<text x="450" y="546" text-anchor="middle" font-size="9.5" fill="#2563eb">check_portability</text>
<text x="450" y="562" text-anchor="middle" font-size="9.5" fill="#2563eb">get_hardware_profile</text>

<rect x="612" y="462" width="232" height="106" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>

<text x="728" y="514" text-anchor="middle" font-size="9.5" fill="#16a34a">compile_and_benchmark</text>
<text x="728" y="530" text-anchor="middle" font-size="9.5" fill="#16a34a">verify_equivalence</text>
<text x="728" y="546" text-anchor="middle" font-size="9.5" fill="#16a34a">submit_optimization</text>
<text x="728" y="562" text-anchor="middle" font-size="9.5" fill="#16a34a">← triggers terminal reward</text>
